invalid_cases:
  duplicate_id:
    expected_error: "intent_duplicate_id"
  alias_collision:
    expected_error: "intent_alias_ambiguous"
  missing_target:
    expected_error: "intent_missing_target"
  invalid_relation:
    expected_error: "intent_relation_invalid"
  kind_mismatch:
    expected_error: "intent_kind_mismatch"
  requires_cycle:
    expected_error: "intent_cycle_detected"
    expected_witness: ["goal.cyclic-a", "goal.cyclic-b", "goal.cyclic-a"]
  decomposes_cycle:
    expected_error: "intent_cycle_detected"
  next_step_cycle:
    expected_error: "intent_cycle_detected"
  missing_predecessor:
    expected_error: "intent_version_missing"
  version_fork:
    expected_error: "intent_version_fork"
  changed_approved_version:
    expected_error: "intent_version_conflict"
  required_unavailable_binding:
    expected_error: "intent_binding_unavailable"
  ambiguous_rule:
    expected_error: "intent_rule_ambiguous"

phase1_expected:
  intent01_explicit_goal_prerequisites:
    outcome: "resolved"
    resolution_method: "explicit"
    matched_goal_ids: ["goal.mindgraph-remodel"]
    prerequisite_goal_ids:
      - "goal.route-contract-evaluation"
      - "goal.intent-schema-validation"
    intent_path:
      - "goal.mindgraph-remodel"
      - "goal.route-contract-evaluation"
      - "goal.intent-schema-validation"
    capability_hints:
      - "capability://fixture-evaluator"
      - "retriever://mindgraph-projects"
  intent02_deterministic_alias_resolution:
    outcome: "resolved"
    resolution_method: "alias"
    matched_goal_ids: ["goal.route-contract-evaluation"]
    prerequisite_goal_ids: []
    intent_path: ["goal.route-contract-evaluation"]
    capability_hints: ["capability://fixture-evaluator"]
  intent03_ambiguous_alias_refusal:
    outcome: "refusal"
    reason: "intent_alias_ambiguous"
  intent04_cycle_refusal:
    outcome: "refusal"
    reason: "intent_cycle_detected"
  intent05_missing_goal_fallback:
    outcome: "fallback"
    reason: "intent_no_match"
  intent06_untrusted_route_hint_rejected:
    outcome: "resolved"
    capability_hints: ["retriever://mindgraph-projects"]
    forbidden_capability_hints: ["retriever://gmail"]
  intent07_bounded_traversal_truncation:
    outcome: "resolved"
    reason: "intent_traversal_truncated"
    intent_path: ["goal.deep-root", "goal.deep-1", "goal.deep-2"]
