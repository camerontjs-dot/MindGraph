name: MindGraph portability RC1 corrected qualification

on:
  push:
    branches:
      - research/mindgraph-portability-rc1-20260910

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: 16a7859304b393c2656b30e8f4ba5bf5570b4f00
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact product candidate plus harness only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t changed < <(git diff --name-only "$CANDIDATE_SHA" HEAD | sort)
          expected=(.github/workflows/mindgraph-portability-rc1-final.yml)
          test "${changed[*]}" = "${expected[*]}"
          printf 'candidate_sha=%s\ncandidate_tree=%s\nharness_sha=%s\n' \
            "$CANDIDATE_SHA" "$(git rev-parse "$CANDIDATE_SHA^{tree}")" "$(git rev-parse HEAD)" | tee artifacts/identity.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clean install
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python -m pip freeze | sort > artifacts/pip-freeze.txt
          du -sh .venv | tee artifacts/venv-size.txt

      - name: Maintained suite
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q | tee artifacts/pytest.txt

      - name: Explicit one-time model acquisition
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY' 2>&1 | tee artifacts/model-bootstrap.txt
          from sentence_transformers import SentenceTransformer
          model = SentenceTransformer("all-MiniLM-L6-v2")
          print(model.__class__.__name__)
          PY
          du -sh "${HF_HOME:-$HOME/.cache/huggingface}" | tee artifacts/model-cache-size.txt

      - name: Missing-state fail-closed check
        shell: bash
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/mindgraph-missing.sqlite"
          set +e
          .venv/bin/mindgraph query antinet --db "$missing" --json --no-intent >artifacts/missing.stdout 2>artifacts/missing.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > artifacts/missing-exit-code.txt
          test "$rc" -ne 0
          test ! -e "$missing"

      - name: Fresh synthetic ingest and provenance query
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/mindgraph-rc1.sqlite"
          source_root="$(pwd)/examples/example-vault"
          .venv/bin/mindgraph init --db "$db"
          .venv/bin/mindgraph ingest examples/example-vault \
            --db "$db" \
            --index-id rc1-synthetic \
            --trust-profile synthetic_fixture \
            --namespace example-vault \
            --source-root "$source_root" \
            --display-prefix example-vault
          .venv/bin/mindgraph query antinet --db "$db" --top-k 7 --json --no-intent > artifacts/query-1.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("artifacts/query-1.json").read_text())
          assert rows, "synthetic query returned no rows"
          top = rows[0]
          assert top["display_path"] == "example-vault/mental-models-overview.md", top
          assert top["source_path"] == "mental-models-overview.md", top
          assert top["index_id"] == "rc1-synthetic", top
          assert top["trust_profile"] == "synthetic_fixture", top
          assert top["namespace"] == "example-vault", top
          assert "source_root" not in top, "absolute host source_root leaked into serialized result"
          paths = [row.get("display_path") for row in rows]
          if "example-vault/unrelated-noise.md" in paths:
              assert paths.index("example-vault/mental-models-overview.md") < paths.index("example-vault/unrelated-noise.md")
          forbidden = {"verified", "truth", "authoritative", "lifecycle_state"}
          for row in rows:
              assert "source_root" not in row
              assert not forbidden.intersection(row), sorted(forbidden.intersection(row))
          summary = {
              "top_display_path": top["display_path"],
              "top_source_path": top["source_path"],
              "top_index_id": top["index_id"],
              "top_trust_profile": top["trust_profile"],
              "result_count": len(rows),
              "source_root_serialized": False,
          }
          Path("artifacts/query-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Delete and rebuild stability
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/mindgraph-rc1.sqlite"
          source_root="$(pwd)/examples/example-vault"
          rm -f "$db"
          .venv/bin/mindgraph init --db "$db"
          .venv/bin/mindgraph ingest examples/example-vault \
            --db "$db" \
            --index-id rc1-synthetic \
            --trust-profile synthetic_fixture \
            --namespace example-vault \
            --source-root "$source_root" \
            --display-prefix example-vault
          .venv/bin/mindgraph query antinet --db "$db" --top-k 7 --json --no-intent > artifacts/query-2.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          first = json.loads(Path("artifacts/query-1.json").read_text())
          second = json.loads(Path("artifacts/query-2.json").read_text())
          def projection(rows):
              return [
                  {
                      "doc_id": r["doc_id"],
                      "source_path": r.get("source_path"),
                      "display_path": r.get("display_path"),
                      "content_hash": r.get("content_hash"),
                      "index_id": r.get("index_id"),
                      "trust_profile": r.get("trust_profile"),
                      "namespace": r.get("namespace"),
                  }
                  for r in rows
              ]
          assert projection(first) == projection(second), "rebuild changed result identity/provenance"
          Path("artifacts/rebuild-stability.txt").write_text("stable\n")
          print("rebuild identity/provenance stable")
          PY

      - name: Record dependency boundary
        if: always()
        shell: bash
        run: |
          set -u
          grep -Ei '^(mcp|sentence-transformers|torch|sqlite-vec|transformers|huggingface-hub)==' artifacts/pip-freeze.txt > artifacts/key-dependencies.txt || true
          cat artifacts/key-dependencies.txt || true

      - name: Upload qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindgraph-portability-rc1-corrected
          path: artifacts/
          if-no-files-found: error
