name: MindGraph portability RC1 bootstrap

on:
  push:
    branches:
      - research/mindgraph-portability-rc1-20260910

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 4d292179e1478b999bc6b7c36f9de564c07bd1d9
      BRANCH: research/mindgraph-portability-rc1-20260910
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = ".github/workflows/mindgraph-portability-rc1-bootstrap.yml"
          grep -Fx 'from typing import Any, Protocol' src/mindgraph/query.py
          grep -Fx '    "mcp>=1.0.0",' pyproject.toml
          test -f tests/test_pruning.py

      - name: Apply bounded portability repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          query = Path("src/mindgraph/query.py")
          text = query.read_text()
          old = "from typing import Any, Protocol\n"
          new = "from typing import Any, Literal, Protocol\n"
          assert text.count(old) == 1, "query.py typing import drifted"
          query.write_text(text.replace(old, new, 1))

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          old = '    "mcp>=1.0.0",\n'
          new = '    "mcp>=1.0.0,<2",\n'
          assert text.count(old) == 1, "pyproject MCP declaration drifted"
          pyproject.write_text(text.replace(old, new, 1))
          PY
          git rm tests/test_pruning.py
          git rm .github/workflows/mindgraph-portability-rc1-bootstrap.yml
          git diff --check
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" | sort)
          expected=(pyproject.toml src/mindgraph/query.py tests/test_pruning.py)
          test "${changed[*]}" = "${expected[*]}"
          git diff --stat "$BASE_SHA"

      - name: Commit bounded repairs to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore clean MindGraph portability baseline"
          git push origin "HEAD:$BRANCH"
          echo "REPAIR_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clean install
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python -m pip freeze | sort > "$RUNNER_TEMP/pip-freeze.txt"
          du -sh .venv | tee "$RUNNER_TEMP/venv-size.txt"

      - name: Maintained test suite
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q

      - name: Missing-state fail-closed check
        shell: bash
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/mindgraph-missing.sqlite"
          set +e
          .venv/bin/mindgraph query antinet --db "$missing" --json --no-intent >"$RUNNER_TEMP/missing.stdout" 2>"$RUNNER_TEMP/missing.stderr"
          rc=$?
          set -e
          test "$rc" -ne 0
          test ! -e "$missing"
          printf 'missing-state exit=%s\n' "$rc"
          cat "$RUNNER_TEMP/missing.stderr"

      - name: Fresh synthetic ingest and query
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/mindgraph-rc1.sqlite"
          root="$(pwd)/examples/example-vault"
          .venv/bin/mindgraph init --db "$db"
          .venv/bin/mindgraph ingest examples/example-vault \
            --db "$db" \
            --index-id rc1-synthetic \
            --trust-profile synthetic_fixture \
            --namespace example-vault \
            --source-root "$root" \
            --display-prefix example-vault
          .venv/bin/mindgraph query antinet --db "$db" --top-k 7 --json --no-intent > "$RUNNER_TEMP/query-1.json"
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"]) / "query-1.json"
          rows = json.loads(p.read_text())
          assert rows, "synthetic query returned no rows"
          top = rows[0]
          assert top["display_path"] == "example-vault/mental-models-overview.md", top
          assert top["source_path"] == "mental-models-overview.md", top
          assert top["source_root"], top
          assert top["index_id"] == "rc1-synthetic", top
          assert top["trust_profile"] == "synthetic_fixture", top
          assert top["namespace"] == "example-vault", top
          paths = [row.get("display_path") for row in rows]
          if "example-vault/unrelated-noise.md" in paths:
              assert paths.index("example-vault/mental-models-overview.md") < paths.index("example-vault/unrelated-noise.md")
          forbidden = {"verified", "truth", "authoritative", "lifecycle_state"}
          assert not forbidden.intersection(top), sorted(forbidden.intersection(top))
          print(json.dumps({
              "top_display_path": top["display_path"],
              "top_source_path": top["source_path"],
              "top_index_id": top["index_id"],
              "top_trust_profile": top["trust_profile"],
              "result_count": len(rows),
          }, indent=2))
          PY

      - name: Delete and rebuild stability
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/mindgraph-rc1.sqlite"
          root="$(pwd)/examples/example-vault"
          rm -f "$db"
          .venv/bin/mindgraph init --db "$db"
          .venv/bin/mindgraph ingest examples/example-vault \
            --db "$db" \
            --index-id rc1-synthetic \
            --trust-profile synthetic_fixture \
            --namespace example-vault \
            --source-root "$root" \
            --display-prefix example-vault
          .venv/bin/mindgraph query antinet --db "$db" --top-k 7 --json --no-intent > "$RUNNER_TEMP/query-2.json"
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          first = json.loads((root / "query-1.json").read_text())
          second = json.loads((root / "query-2.json").read_text())
          projection = lambda rows: [
              {
                  "doc_id": r["doc_id"],
                  "source_path": r.get("source_path"),
                  "display_path": r.get("display_path"),
                  "content_hash": r.get("content_hash"),
                  "index_id": r.get("index_id"),
                  "trust_profile": r.get("trust_profile"),
                  "namespace": r.get("namespace"),
              }
              for r in rows
          ]
          assert projection(first) == projection(second), "rebuild changed result identity/provenance"
          print("rebuild identity/provenance stable")
          PY

      - name: Qualification summary
        if: always()
        shell: bash
        run: |
          set -u
          echo "base_sha=$BASE_SHA"
          echo "repair_sha=${REPAIR_SHA:-not_committed}"
          if test -f "$RUNNER_TEMP/venv-size.txt"; then cat "$RUNNER_TEMP/venv-size.txt"; fi
          if test -f "$RUNNER_TEMP/pip-freeze.txt"; then grep -E '^(mcp|sentence-transformers|torch|sqlite-vec)==' "$RUNNER_TEMP/pip-freeze.txt" || true; fi
